name: Build & Qodana
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Qodana - License Audit
        uses: JetBrains/qodana-license-audit-action@v2.0-eap
      - name: Qodana - Clone Finder
        uses: JetBrains/qodana-clone-finder-action@v2.0-eap
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2.1-eap
        with:
          cache-dir: /home/runner/work/_temp/_github_home/qodana-cache